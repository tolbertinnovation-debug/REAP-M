services:
  market:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    volumes:
      - market_data:/app/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MARKET_DOMAIN: ${MARKET_DOMAIN:?Set MARKET_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      market:
        condition: service_healthy
volumes:
  market_data:
  caddy_data:
  caddy_config:
